name: CI

on:
  workflow_call: {}
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, whole repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: python -m ruff check .

  test:
    name: Test (${{ matrix.project.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: web-app
            dir: hdmi-matrix-ui/backend
            python: "3.12"
          # pytest-homeassistant-custom-component runs a real in-process
          # Home Assistant, which needs current HA's Python.
          - name: home-assistant-integration
            dir: ha-hdmi-matrix
            python: "3.14"
    defaults:
      run:
        working-directory: ${{ matrix.project.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.project.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.project.dir }}/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax sanity (py_compile every module)
        run: find . -name "*.py" -not -path "*/tests/*" -print0 | xargs -0 -n1 python -m py_compile

      - name: Test (pytest, with coverage)
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.project.name }}
          path: ${{ matrix.project.dir }}/coverage.xml
          retention-days: 14

  protocol-consistency:
    name: Shared protocol client stays in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Diff the two matrix_client.py copies
        run: |
          WEB=hdmi-matrix-ui/backend/matrix_client.py
          HA=ha-hdmi-matrix/custom_components/hdmi_matrix/matrix_client.py
          if ! diff -u "$WEB" "$HA"; then
            echo
            echo "::error::matrix_client.py has diverged between the web app and the Home Assistant integration."
            echo "::error::Apply the same change to both copies (see docs/ROADMAP.md for the plan to de-duplicate this)."
            echo "::error::Behavior shared with the Swift client is checked by the cases in docs/protocol-fixtures.json."
            exit 1
          fi
          echo "In sync."

  version-consistency:
    name: Version files agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # release-please bumps all of these together; a hand edit to just one
      # would ship mismatched versions.
      - name: Compare version files
        run: |
          python3 - <<'PY'
          import json, re, sys
          ios_versions = set(re.findall(
              r"MARKETING_VERSION = ([0-9.]+);", open("ios-app/HDMIMatrix.xcodeproj/project.pbxproj").read()
          ))
          if len(ios_versions) != 1:
              print("::error::iOS MARKETING_VERSION differs between build configurations.")
              sys.exit(1)
          versions = {
              ".release-please-manifest.json": json.load(open(".release-please-manifest.json"))["."],
              "version.txt": open("version.txt").read().strip(),
              "ha manifest.json": json.load(open("ha-hdmi-matrix/custom_components/hdmi_matrix/manifest.json"))["version"],
              "web-app version.py": re.search(
                  r'__version__ = "([^"]+)"', open("hdmi-matrix-ui/backend/version.py").read()
              ).group(1),
              "service-worker APP_VERSION": re.search(
                  r"APP_VERSION = '([^']+)'", open("hdmi-matrix-ui/frontend/sw.js").read()
              ).group(1),
              "iOS MARKETING_VERSION": ios_versions.pop(),
          }
          for name, version in versions.items():
              print(f"{name}: {version}")
          if len(set(versions.values())) != 1:
              print("::error::Version files disagree. Let release-please bump versions instead of editing them by hand.")
              sys.exit(1)
          PY

  docker-build:
    name: Web app image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: hdmi-matrix-ui
          push: false
          load: true
          tags: hdmi-matrix-ui:ci
      - name: Smoke test against the demo matrix
        run: |
          docker run -d --name ui -e MATRIX_HOST=mock -p 8765:8765 hdmi-matrix-ui:ci
          ready=0
          for i in $(seq 1 40); do
            health=$(docker inspect --format '{{.State.Health.Status}}' ui 2>/dev/null || true)
            if [ "$health" = "healthy" ]; then
              ready=1
              break
            fi
            if [ "$health" = "unhealthy" ]; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs ui
            exit 1
          fi
          for path in / /app.js /styles.css /manifest.json /icons/icon.svg /sw.js; do
            curl -fsS -o /dev/null "http://localhost:8765$path"
          done
          curl -fsS http://localhost:8765/api/state -o /dev/null
          version=$(curl -fsS http://localhost:8765/api/version)
          python3 -c 'import json,sys; data=json.loads(sys.argv[1]); assert all(data.get(key) for key in ("version", "channel", "revision"))' "$version"
          revision=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["revision"])' "$version")
          curl -fsS http://localhost:8765/sw.js | grep -F -- "$revision" >/dev/null
          echo "Frontend assets and backend API responded successfully."

  hassfest:
    name: Validate HA manifest (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The home-assistant/actions/hassfest composite action takes no path
      # input and expects custom_components/ at the repo root (the usual
      # single-integration-repo layout). This is a monorepo, so it's run
      # directly instead, mounted at ha-hdmi-matrix/ (which does have
      # custom_components/hdmi_matrix/ at its root).
      - name: Run hassfest
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/ha-hdmi-matrix:/github/workspace" \
            ghcr.io/home-assistant/hassfest

  frontend-smoke:
    name: Frontend asset sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON (manifest.json etc.)
        run: |
          set -e
          for f in $(find . -name "*.json" -not -path "./.git/*"); do
            python3 -c "import json,sys; json.load(open('$f'))" || { echo "Invalid JSON: $f"; exit 1; }
          done
      - name: Check PWA icons referenced in manifest.json exist
        run: |
          test -f hdmi-matrix-ui/frontend/icons/icon.svg
          test -f hdmi-matrix-ui/frontend/icons/icon-180.png
          test -f hdmi-matrix-ui/frontend/icons/icon-512.png

  ios-unit:
    name: iOS — MatrixKit unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - name: Test MatrixKit (protocol client)
        run: swift test
        working-directory: ios-app/MatrixKit

  ios-ui:
    name: iOS — app build + UI tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The app targets iOS 26 (Liquid Glass), so it needs the Xcode 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS-26" not in runtime:
                  continue
              for d in items:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("no iOS 26 iPhone simulator available")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
      - name: Build and run UI tests (demo matrix)
        working-directory: ios-app
        run: |
          xcodebuild test \
            -project HDMIMatrix.xcodeproj -scheme HDMIMatrix \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Export walkthrough screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/ui.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/screenshots"
          fi
      # Every PR gets a screenshot walkthrough of the app to review.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-ui-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-ui-xcresult
          path: ${{ runner.temp }}/ui.xcresult
          retention-days: 7
