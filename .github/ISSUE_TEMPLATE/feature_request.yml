name: Feature request
description: Suggest an improvement to the web app, the Home Assistant integration, or the docs
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Where should this live?
      options:
        - Web app (hdmi-matrix-ui)
        - Home Assistant integration (ha-hdmi-matrix)
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's the problem or gap?
      description: What can't you do today, or what's annoying/manual right now?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you want to happen instead? Sketches/mockups welcome.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
