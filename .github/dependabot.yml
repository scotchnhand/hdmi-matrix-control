version: 2

# Keep version bumps together so one weekly review covers the repository.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "pip"
    directories:
      - "/hdmi-matrix-ui"
      - "/ha-hdmi-matrix"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
